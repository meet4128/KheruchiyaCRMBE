<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kheruchiya CRM — Password</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f8;
        color: #1a1a1a;
      }
      .card {
        background: #fff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 400px;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      .sub { color: #555; font-size: 0.9rem; margin-bottom: 1.5rem; }
      label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; }
      input {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 1rem;
      }
      button {
        width: 100%;
        padding: 0.75rem;
        background: #1f6feb;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .msg { margin-top: 1rem; font-size: 0.9rem; }
      .err { color: #b42318; }
      .ok { color: #067647; }
      .hidden { display: none; }
    </style>
  </head>
  <body data-purpose="invite">
    <div class="card">
      <h1 id="title">Set your password</h1>
      <p class="sub" id="subtitle">Loading…</p>
      <form id="form" class="hidden">
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="8" />
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" required minlength="8" />
        <button type="submit" id="submit">Save password</button>
      </form>
      <p id="message" class="msg hidden"></p>
    </div>
    <script>
      (function () {
        const PURPOSE = document.body.dataset.purpose || 'invite';
        const isReset = PURPOSE === 'reset';
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const form = document.getElementById('form');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submit');

        title.textContent = isReset ? 'Reset your password' : 'Set your password';
        submitBtn.textContent = isReset ? 'Reset password' : 'Set password';

        function showError(text) {
          message.textContent = text;
          message.className = 'msg err';
          message.classList.remove('hidden');
        }
        function showOk(text) {
          message.textContent = text;
          message.className = 'msg ok';
          message.classList.remove('hidden');
        }

        if (!token || token.length < 32) {
          showError('Invalid or missing link. Please request a new email from your admin.');
          return;
        }

        fetch('/api/v1/auth/token/validate?token=' + encodeURIComponent(token) + '&purpose=' + PURPOSE)
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            var data = res.d && res.d.data;
            if (!res.ok) {
              var m = (res.d && res.d.message) || (data && data.message) || 'This link is invalid or expired.';
              showError(m);
              return;
            }
            if (data && data.valid === false) {
              showError(data.message || 'This link is no longer valid.');
              return;
            }
            var email = data && data.email;
            subtitle.textContent = email
              ? 'For account: ' + email
              : 'Choose a strong password (8+ chars, letter and number).';
            form.classList.remove('hidden');
          })
          .catch(function () {
            showError('Could not verify link. Is the API server running?');
          });

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var pw = document.getElementById('password').value;
          var cf = document.getElementById('confirm').value;
          if (pw !== cf) {
            showError('Passwords do not match.');
            return;
          }
          submitBtn.disabled = true;
          var path = isReset ? '/api/v1/auth/reset-password' : '/api/v1/auth/set-password';
          fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: pw }),
          })
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (res) {
              if (!res.ok) {
                var m =
                  (res.d && res.d.message) ||
                  (res.d && res.d.data && res.d.data.message) ||
                  (res.d && res.d.errors && res.d.errors[0] && res.d.errors[0].message) ||
                  'Could not save password.';
                showError(m);
                submitBtn.disabled = false;
                return;
              }
              form.classList.add('hidden');
              showOk('Password saved. You can close this tab and log in to the app.');
            })
            .catch(function () {
              showError('Network error. Try again.');
              submitBtn.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
